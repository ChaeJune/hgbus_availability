name: monitor

on:
  schedule:
    # 15분 간격 (UTC 기준, KST 운항시간 외에도 웹사이트 가용성은 계속 기록)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run check
        run: python -m monitor check

      - name: Commit results
        run: |
          git config user.name "hgbus-monitor[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/summary.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: record status check ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          for i in 1 2 3 4; do
            git push && exit 0
            sleep $((2 ** i))
            git pull --rebase
          done
          git push
